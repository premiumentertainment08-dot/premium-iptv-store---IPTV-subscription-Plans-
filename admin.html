<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Premium Entertainment</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101c;color:#eef5ff;font-family:system-ui}.wrap{max-width:1050px;margin:auto;padding:14px}.head{background:linear-gradient(135deg,#7c3cff,#00c8ff);padding:18px;border-radius:18px}.box{margin-top:12px;background:#0c192a;border:1px solid #294761;border-radius:16px;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}input,select{width:100%;background:#07101b;color:#fff;border:1px solid #2a4661;border-radius:9px;padding:10px;margin-top:4px}label{font-size:9px;color:#9eb0c7;font-weight:900}button{border:0;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,#7c3cff,#00c8ff);color:#fff}.secondary{background:#16263a;color:#fff}.danger{background:#461924;color:#ffb4bf}.item{border:1px solid #294761;border-radius:12px;padding:10px;margin-top:8px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#9eb0c7;font-size:11px}.hidden{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#102136;border:1px solid #294761;border-radius:12px;padding:10px}.stat b{font-size:20px}.stat span{display:block;font-size:9px;color:#9eb0c7}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="head"><h1>👑 Premium Entertainment Admin</h1><p>Plans • Prices • Orders • Payment status</p></div>
<div class="box"><div class="actions"><button class="primary" onclick="show('plans')">📦 Plans</button><button class="secondary" onclick="show('orders')">🧾 Orders</button><button class="secondary" onclick="location.href='./index.html'">🏠 Store</button></div></div>
<section id="plans" class="box"><h3>Add / Edit Plan</h3><div class="grid"><div><label>NAME</label><input id="n"></div><div><label>CATEGORY</label><input id="c" value="IPTV Services"></div><div><label>PRICE</label><input id="p" type="number"></div><div><label>VALIDITY / DETAILS</label><input id="m"></div><div><label>TAG</label><input id="t" value="IPTV"></div></div><div class="actions"><button class="primary" onclick="save()">Save Plan</button><button class="secondary" onclick="resetForm()">Clear</button></div><div id="plist"></div></section>
<section id="orders" class="box hidden"><div class="stats"><div class="stat"><b id="oa">0</b><span>ALL</span></div><div class="stat"><b id="op">0</b><span>PENDING</span></div><div class="stat"><b id="od">0</b><span>PAID</span></div><div class="stat"><b id="or">₹0</b><span>PAID VALUE</span></div></div><div id="olist" style="margin-top:10px"></div></section></div>
<script>
let products=[],edit=-1;
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function boot(){products=await fetch('./products.json').then(r=>r.json());renderPlans();renderOrders()}
function save(){let x={name:$('n').value.trim(),cat:$('c').value.trim(),price:Number($('p').value||0),meta:$('m').value.trim(),tag:$('t').value.trim()};if(!x.name||!x.price){alert('Name and price required');return}if(edit>=0)products[edit]=x;else products.push(x);localStorage.setItem('pe_products',JSON.stringify(products));resetForm();renderPlans()}
function resetForm(){edit=-1;['n','p','m','t'].forEach(id=>$(id).value='');$('c').value='IPTV Services'}
function renderPlans(){let custom=localStorage.getItem('pe_products');if(custom)products=JSON.parse(custom);$('plist').innerHTML=products.map((x,i)=>'<div class="item"><div class="row"><div><b>'+esc(x.name)+' — '+money(x.price)+'</b><div class="muted">'+esc(x.meta)+'</div></div><div class="actions"><button class="secondary" onclick="editPlan('+i+')">Edit</button><button class="danger" onclick="delPlan('+i+')">Delete</button></div></div></div>').join('')}
function editPlan(i){edit=i;let x=products[i];$('n').value=x.name;$('c').value=x.cat;$('p').value=x.price;$('m').value=x.meta;$('t').value=x.tag;scrollTo(0,0)}
function delPlan(i){if(confirm('Delete this plan?')){products.splice(i,1);localStorage.setItem('pe_products',JSON.stringify(products));renderPlans()}}
function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='orders')renderOrders()}
function renderOrders(){let a=JSON.parse(localStorage.getItem('pe_orders')||'[]');$('oa').textContent=a.length;$('op').textContent=a.filter(x=>x.status==='pending').length;$('od').textContent=a.filter(x=>['paid','fulfilled'].includes(x.status)).length;$('or').textContent=money(a.filter(x=>['paid','fulfilled'].includes(x.status)).reduce((s,x)=>s+Number(x.amount||0),0));$('olist').innerHTML=a.map((x,i)=>'<div class="item"><div class="row"><div><b>'+esc(x.product)+'</b><div class="muted">'+esc(x.plan)+' • '+money(x.amount)+'</div><div class="muted">👤 '+esc(x.name)+' • 📱 '+esc(x.phone)+' • '+esc(x.id)+'</div></div><span>'+esc(x.status.toUpperCase())+'</span></div><div class="actions"><button class="primary" onclick="status('+i+',\\'paid\\')">✓ Paid</button><button class="secondary" onclick="status('+i+',\\'fulfilled\\')">📦 Fulfilled</button><button class="secondary" onclick="status('+i+',\\'pending\\')">↺ Pending</button><button class="danger" onclick="status('+i+',\\'cancelled\\')">Cancel</button></div></div>').join('')||'<div class="muted">No orders yet.</div>'}
function status(i,s){let a=JSON.parse(localStorage.getItem('pe_orders')||'[]');a[i].status=s;localStorage.setItem('pe_orders',JSON.stringify(a));renderOrders()}
boot();
</script></body></html>
